---
- name: Deploy sheikh-webapp to k3s on Azure VM
  hosts: azure
  gather_facts: false
  vars:
    k8s_namespace: sheikh-devops
    app_label: sheikh-webapp
    k8s_dir: /tmp/sheikh-webapp-k8s
  tasks:
    - name: Ensure namespace exists
      ansible.builtin.shell: kubectl create namespace {{ k8s_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false

    - name: Copy K8s manifests to VM
      ansible.builtin.copy:
        src: ../k8s/
        dest: "{{ k8s_dir }}/"
        mode: "0644"

    - name: Apply K8s manifests
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}/
      register: apply_out
      changed_when: "'unchanged' not in apply_out.stdout"

    - name: Wait for rollout
      ansible.builtin.command: kubectl -n {{ k8s_namespace }} rollout status deploy/{{ app_label }} --timeout=120s
      changed_when: false

    - name: Show pods and service
      ansible.builtin.command: kubectl -n {{ k8s_namespace }} get pods,svc -o wide
      register: get_out
      changed_when: false

    - name: Print status
      ansible.builtin.debug:
        msg: "{{ get_out.stdout_lines }}"
